[build]
  command = "npm --workspace @km/client run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_STANDALONE = "false"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/responsive/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "https://km-real-estate-oregon.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
