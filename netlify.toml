[build]
  command = "npm --workspace @km/client run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_STANDALONE = "false"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/responsive/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/library/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
  from = "https://www.kmrealestatecompany.com/*"
  to = "https://kmrealestatecompany.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://k-m-realestate.netlify.app/*"
  to = "https://kmrealestatecompany.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://km-real-estate-oregon.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/assets/*"
  to = "https://km-real-estate-oregon.onrender.com/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "https://km-real-estate-oregon.onrender.com/"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://km-real-estate-oregon.onrender.com/:splat"
  status = 200
