[build]
  command = "npm --workspace @km/client run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_STANDALONE = "false"

# Keep API requests on the frontend origin for secure session cookies.
# These rules must precede the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://km-real-estate-oregon.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://km-real-estate-oregon.onrender.com/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
