# Free resources only. Render's free PostgreSQL expires after 30 days.
services:
  - type: web
    name: km-real-estate
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    # Free web services do not support pre-deploy commands or dashboard Shell.
    # Fail startup if migrations or approved-content initialization fail.
    startCommand: npm run db:migrate && npm run db:seed && npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: VITE_STANDALONE
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: km-real-estate-db
          property: connectionString
      - key: APP_ORIGIN
        fromService:
          type: web
          name: km-real-estate
          envVarKey: RENDER_EXTERNAL_URL
      - key: SITE_URL
        fromService:
          type: web
          name: km-real-estate
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: km-real-estate-db
    region: frankfurt
    plan: free
    databaseName: km
    user: km
    ipAllowList: []
