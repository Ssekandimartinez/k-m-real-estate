# Free resources only. Render's free PostgreSQL expires after 30 days.
services:
  - type: web
    name: km-real-estate-oregon
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./server/Dockerfile.render
    dockerContext: .
    # Free web services do not support pre-deploy commands or dashboard Shell.
    # Fail startup if migrations or approved-content initialization fail.
    # The container CMD runs migrations, seeds approved content, then starts Express.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: VITE_STANDALONE
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: km-real-estate-db
          property: connectionString
      - key: APP_ORIGIN
        value: https://k-and-m-realestate.netlify.app
      - key: SITE_URL
        value: https://k-and-m-realestate.netlify.app

databases:
  - name: km-real-estate-db
    region: oregon
    plan: free
    databaseName: km_real_estate_db
    user: km_real_estate_db_user
    ipAllowList: []
