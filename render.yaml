# Free API on Render; production DATABASE_URL is supplied securely from Neon.
services:
  - type: web
    name: km-real-estate-oregon
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./server/Dockerfile.render
    dockerContext: .
    # Free web services do not support pre-deploy commands or dashboard Shell.
    # Fail startup if migrations or approved-content initialization fail.
    # The container CMD runs migrations, seeds approved content, then starts Express.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: VITE_STANDALONE
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        # Existing services retain the secret configured through the API/Dashboard.
        # New Blueprint installations must supply a Neon PostgreSQL connection URL.
        sync: false
      - key: APP_ORIGIN
        value: https://k-m-realestate.netlify.app
      - key: SITE_URL
        value: https://k-m-realestate.netlify.app

databases:
  # Legacy source retained for migration recovery; not used by the migrated API.
  # Do not delete this database or upgrade it automatically.
  - name: km-real-estate-db
    region: oregon
    plan: free
    databaseName: km_real_estate_db
    user: km_real_estate_db_user
    ipAllowList: []
